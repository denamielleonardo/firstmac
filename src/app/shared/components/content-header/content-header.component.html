<div class="contentHeader">
    <div class="headerLabel">
        <span *ngIf="hasBack" class="back" (click)="emitBack.emit()">Back</span>
        <h2>{{ headerTitle }}</h2>
    </div>

    <div *ngIf="hasSearch" class="searchContainer">
        <input type="text" [(ngModel)]="searchText" (ngModelChange)="emitSearchText.emit(searchText)" placeholder="Search..." />
    </div>
</div>
